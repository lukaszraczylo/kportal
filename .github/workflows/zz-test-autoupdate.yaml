name: zz-test-autoupdate
on:
  push:
    branches: [ci/test-autoupdate-go]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.24"
          check-latest: true
          cache: true
      - run: go version && go env GOTOOLCHAIN
      - run: |
          go get -u ./...
          go mod tidy
          git diff --stat go.mod go.sum | tail -3
          grep -E '^go |^toolchain' go.mod
      - run: go test -race ./... 2>&1 | grep -v "^ok\|no test files" | tail -10; echo test-done
